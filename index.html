<!doctype html>
<html lang="th">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบตรวจสอบน้ำตาลในเลือด</title>
  <script src="/_sdk/data_sdk.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      overflow-x: hidden;
    }

    .main-wrapper {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      padding: 20px;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .header p {
      font-size: 1.2em;
      opacity: 0.95;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      margin-bottom: 30px;
    }

    .input-section {
      margin-bottom: 25px;
    }

    .input-label {
      display: block;
      font-size: 1.1em;
      color: #333;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .blood-sugar-input {
      flex: 1;
      padding: 15px 20px;
      font-size: 1.3em;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .blood-sugar-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .unit-label {
      font-size: 1.1em;
      color: #666;
      font-weight: 500;
    }

    .submit-button {
      width: 100%;
      padding: 18px;
      font-size: 1.2em;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .submit-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .submit-button:active {
      transform: translateY(0);
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .result-display {
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      font-size: 1.2em;
      font-weight: 600;
      display: none;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-display.show {
      display: block;
    }

    .result-low {
      background: #fff3cd;
      color: #856404;
      border: 2px solid #ffc107;
    }

    .result-normal {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-risk {
      background: #fff3cd;
      color: #856404;
      border: 2px solid #ffc107;
    }

    .result-high {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .history-section {
      margin-top: 20px;
    }

    .history-title {
      font-size: 1.5em;
      color: #333;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 12px;
    }

    .history-table thead {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .history-table th {
      padding: 15px;
      text-align: left;
      font-weight: 600;
      font-size: 1em;
    }

    .history-table tbody tr {
      background: white;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.3s ease;
    }

    .history-table tbody tr:hover {
      background: #f8f9ff;
    }

    .history-table td {
      padding: 15px;
      color: #333;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9em;
      font-weight: 600;
    }

    .status-low {
      background: #fff3cd;
      color: #856404;
    }

    .status-normal {
      background: #d4edda;
      color: #155724;
    }

    .status-risk {
      background: #fff3cd;
      color: #856404;
    }

    .status-high {
      background: #f8d7da;
      color: #721c24;
    }

    .delete-button {
      padding: 8px 16px;
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9em;
      font-weight: 600;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .delete-button:hover {
      background: #c82333;
      transform: scale(1.05);
    }

    .delete-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
      font-size: 1.1em;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .limit-warning {
      background: #fff3cd;
      color: #856404;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
      text-align: center;
      font-weight: 600;
    }

    .limit-warning.show {
      display: block;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2em;
      }

      .header p {
        font-size: 1em;
      }

      .card {
        padding: 20px;
      }

      .history-table {
        font-size: 0.9em;
      }

      .history-table th,
      .history-table td {
        padding: 10px 8px;
      }

      .delete-button {
        padding: 6px 12px;
        font-size: 0.85em;
      }
    }

    @media (max-width: 480px) {
      .main-wrapper {
        padding: 15px;
      }

      .header h1 {
        font-size: 1.6em;
      }

      .card {
        padding: 15px;
      }

      .history-table {
        font-size: 0.8em;
      }

      .history-table th,
      .history-table td {
        padding: 8px 5px;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="main-wrapper">
   <div class="container">
    <div class="header">
     <h1 id="page-title">ระบบตรวจสอบน้ำตาลในเลือด</h1>
     <p id="subtitle">บันทึกและติดตามระดับน้ำตาลในเลือดของคุณ</p>
    </div>
    <div class="card">
     <div class="input-section"><label for="blood-sugar" class="input-label">ระดับน้ำตาลในเลือด</label>
      <div class="input-wrapper"><input type="number" id="blood-sugar" class="blood-sugar-input" placeholder="กรอกค่าน้ำตาล" min="0" step="1"> <span class="unit-label">mg/dL</span>
      </div>
     </div><button id="submit-button" class="submit-button">บันทึกผล</button>
     <div id="result-display" class="result-display"></div>
     <div id="limit-warning" class="limit-warning">
      ⚠️ ถึงขีดจำกัดการบันทึก 999 รายการแล้ว กรุณาลบรายการเก่าก่อนเพิ่มใหม่
     </div>
    </div>
    <div class="card history-section">
     <h2 id="history-title" class="history-title">ประวัติการบันทึก</h2>
     <div id="history-container">
      <div class="empty-state">
       ยังไม่มีประวัติการบันทึก
      </div>
     </div>
    </div>
   </div>
  </div>
  <script>
    const defaultConfig = {
      page_title: "ระบบตรวจสอบน้ำตาลในเลือด",
      subtitle: "บันทึกและติดตามระดับน้ำตาลในเลือดของคุณ",
      submit_button_text: "บันทึกผล",
      history_title: "ประวัติการบันทึก",
      background_color: "#667eea",
      surface_color: "#ffffff",
      text_color: "#333333",
      primary_action_color: "#667eea",
      secondary_action_color: "#dc3545",
      font_family: "Sarabun",
      font_size: 16
    };

    let allRecords = [];
    let isProcessing = false;

    const dataHandler = {
      onDataChanged(data) {
        allRecords = data;
        renderHistory();
      }
    };

    function getBloodSugarStatus(value) {
      if (value < 70) {
        return { status: "ต่ำ", class: "low" };
      } else if (value >= 70 && value <= 100) {
        return { status: "ปกติ", class: "normal" };
      } else if (value > 100 && value <= 125) {
        return { status: "เสี่ยง", class: "risk" };
      } else {
        return { status: "สูง", class: "high" };
      }
    }

    function formatDate(isoString) {
      const date = new Date(isoString);
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${day}/${month}/${year} ${hours}:${minutes}`;
    }

    function renderHistory() {
      const container = document.getElementById('history-container');
      
      if (allRecords.length === 0) {
        container.innerHTML = '<div class="empty-state">ยังไม่มีประวัติการบันทึก</div>';
        return;
      }

      const sortedRecords = [...allRecords].sort((a, b) => {
        return new Date(b.timestamp) - new Date(a.timestamp);
      });

      const tableHTML = `
        <table class="history-table">
          <thead>
            <tr>
              <th>วันที่/เวลา</th>
              <th>ระดับน้ำตาล</th>
              <th>สถานะ</th>
              <th>การจัดการ</th>
            </tr>
          </thead>
          <tbody>
            ${sortedRecords.map(record => `
              <tr>
                <td>${formatDate(record.timestamp)}</td>
                <td>${record.bloodSugar} mg/dL</td>
                <td><span class="status-badge status-${getBloodSugarStatus(record.bloodSugar).class}">${record.status}</span></td>
                <td>
                  <button class="delete-button" onclick="deleteRecord('${record.__backendId}')">ลบ</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      container.innerHTML = tableHTML;
    }

    async function deleteRecord(backendId) {
      const record = allRecords.find(r => r.__backendId === backendId);
      if (!record) return;

      const button = event.target;
      button.disabled = true;
      button.innerHTML = '<span class="loading-spinner"></span>';

      const result = await window.dataSdk.delete(record);

      if (!result.isOk) {
        button.disabled = false;
        button.textContent = 'ลบ';
        showResult('เกิดข้อผิดพลาดในการลบข้อมูล', 'high');
      }
    }

    function showResult(message, statusClass) {
      const resultDisplay = document.getElementById('result-display');
      resultDisplay.className = `result-display result-${statusClass} show`;
      resultDisplay.textContent = message;

      setTimeout(() => {
        resultDisplay.classList.remove('show');
      }, 5000);
    }

    async function handleSubmit(event) {
      event.preventDefault();

      if (isProcessing) return;

      const input = document.getElementById('blood-sugar');
      const bloodSugarValue = parseFloat(input.value);

      if (!bloodSugarValue || bloodSugarValue <= 0) {
        showResult('กรุณากรอกค่าน้ำตาลที่ถูกต้อง', 'high');
        return;
      }

      if (allRecords.length >= 999) {
        document.getElementById('limit-warning').classList.add('show');
        showResult('ถึงขีดจำกัดการบันทึก 999 รายการแล้ว', 'high');
        return;
      }

      const submitButton = document.getElementById('submit-button');
      isProcessing = true;
      submitButton.disabled = true;
      submitButton.innerHTML = '<span class="loading-spinner"></span> กำลังบันทึก...';

      const statusInfo = getBloodSugarStatus(bloodSugarValue);

      const newRecord = {
        bloodSugar: bloodSugarValue,
        status: statusInfo.status,
        timestamp: new Date().toISOString()
      };

      const result = await window.dataSdk.create(newRecord);

      if (result.isOk) {
        showResult(`บันทึกสำเร็จ: ${bloodSugarValue} mg/dL - ${statusInfo.status}`, statusInfo.class);
        input.value = '';
      } else {
        showResult('เกิดข้อผิดพลาดในการบันทึกข้อมูล', 'high');
      }

      isProcessing = false;
      submitButton.disabled = false;
      submitButton.textContent = window.elementSdk?.config?.submit_button_text || defaultConfig.submit_button_text;
    }

    async function onConfigChange(config) {
      document.getElementById('page-title').textContent = config.page_title || defaultConfig.page_title;
      document.getElementById('subtitle').textContent = config.subtitle || defaultConfig.subtitle;
      document.getElementById('submit-button').textContent = config.submit_button_text || defaultConfig.submit_button_text;
      document.getElementById('history-title').textContent = config.history_title || defaultConfig.history_title;

      const customFont = config.font_family || defaultConfig.font_family;
      const baseSize = config.font_size || defaultConfig.font_size;
      const baseFontStack = 'Segoe UI, Tahoma, sans-serif';

      document.body.style.fontFamily = `${customFont}, ${baseFontStack}`;

      document.querySelector('.header h1').style.fontSize = `${baseSize * 2.5}px`;
      document.querySelector('.header p').style.fontSize = `${baseSize * 1.2}px`;
      document.querySelectorAll('.input-label, .unit-label').forEach(el => {
        el.style.fontSize = `${baseSize * 1.1}px`;
      });
      document.querySelector('.blood-sugar-input').style.fontSize = `${baseSize * 1.3}px`;
      document.querySelector('.submit-button').style.fontSize = `${baseSize * 1.2}px`;
      document.querySelector('.history-title').style.fontSize = `${baseSize * 1.5}px`;

      const backgroundColor = config.background_color || defaultConfig.background_color;
      const surfaceColor = config.surface_color || defaultConfig.surface_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const primaryColor = config.primary_action_color || defaultConfig.primary_action_color;
      const secondaryColor = config.secondary_action_color || defaultConfig.secondary_action_color;

      document.body.style.background = `linear-gradient(135deg, ${backgroundColor} 0%, ${backgroundColor} 100%)`;
      document.querySelectorAll('.card').forEach(el => {
        el.style.background = surfaceColor;
      });
      document.querySelectorAll('.header h1, .header p, .history-title, .input-label, .unit-label').forEach(el => {
        if (el.classList.contains('header')) {
          el.style.color = 'white';
        } else {
          el.style.color = textColor;
        }
      });
      document.querySelector('.blood-sugar-input').style.color = textColor;
      document.querySelectorAll('.history-table td').forEach(el => {
        el.style.color = textColor;
      });

      document.querySelector('.submit-button').style.background = `linear-gradient(135deg, ${primaryColor} 0%, ${primaryColor} 100%)`;
      document.querySelector('.submit-button').style.boxShadow = `0 4px 15px ${primaryColor}66`;
      
      document.querySelectorAll('.delete-button').forEach(el => {
        el.style.background = secondaryColor;
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (window.elementSdk) {
        await window.elementSdk.init({
          defaultConfig,
          onConfigChange,
          mapToCapabilities: (config) => ({
            recolorables: [
              {
                get: () => config.background_color || defaultConfig.background_color,
                set: (value) => {
                  config.background_color = value;
                  window.elementSdk.setConfig({ background_color: value });
                }
              },
              {
                get: () => config.surface_color || defaultConfig.surface_color,
                set: (value) => {
                  config.surface_color = value;
                  window.elementSdk.setConfig({ surface_color: value });
                }
              },
              {
                get: () => config.text_color || defaultConfig.text_color,
                set: (value) => {
                  config.text_color = value;
                  window.elementSdk.setConfig({ text_color: value });
                }
              },
              {
                get: () => config.primary_action_color || defaultConfig.primary_action_color,
                set: (value) => {
                  config.primary_action_color = value;
                  window.elementSdk.setConfig({ primary_action_color: value });
                }
              },
              {
                get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
                set: (value) => {
                  config.secondary_action_color = value;
                  window.elementSdk.setConfig({ secondary_action_color: value });
                }
              }
            ],
            borderables: [],
            fontEditable: {
              get: () => config.font_family || defaultConfig.font_family,
              set: (value) => {
                config.font_family = value;
                window.elementSdk.setConfig({ font_family: value });
              }
            },
            fontSizeable: {
              get: () => config.font_size || defaultConfig.font_size,
              set: (value) => {
                config.font_size = value;
                window.elementSdk.setConfig({ font_size: value });
              }
            }
          }),
          mapToEditPanelValues: (config) => new Map([
            ["page_title", config.page_title || defaultConfig.page_title],
            ["subtitle", config.subtitle || defaultConfig.subtitle],
            ["submit_button_text", config.submit_button_text || defaultConfig.submit_button_text],
            ["history_title", config.history_title || defaultConfig.history_title]
          ])
        });
      }

      if (window.dataSdk) {
        const initResult = await window.dataSdk.init(dataHandler);
        if (!initResult.isOk) {
          showResult('ไม่สามารถเชื่อมต่อกับระบบจัดเก็บข้อมูลได้', 'high');
        }
      }

      document.getElementById('submit-button').addEventListener('click', handleSubmit);

      document.getElementById('blood-sugar').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          handleSubmit(e);
        }
      });
    });

    window.deleteRecord = deleteRecord;
  </script>
